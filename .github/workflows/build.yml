name: Build site

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:client
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: client/dist
          if-no-files-found: error
