name: Build site

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:client
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: client/dist
          if-no-files-found: error
      - name: Screenshot the built site
        run: |
          cd client
          bunx vite preview --port 4173 --strictPort &
          npx --yes playwright@1 install --with-deps chromium >/dev/null
          for i in $(seq 1 30); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done
          mkdir -p ../shots
          npx --yes playwright@1 screenshot --full-page --wait-for-timeout 1500 --viewport-size 1440,900 http://localhost:4173 ../shots/desktop.png
          npx --yes playwright@1 screenshot --full-page --wait-for-timeout 1500 --viewport-size 390,844 http://localhost:4173 ../shots/mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
